<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = 'UTF-8'>
        <link rel="stylesheet" href="style.css">
        <title>LIB LOCKER SYSTEM</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>Library Locker Management System</h1>
        <div class="login-area">
            <div class="main">
                <h2>Login</h2>
                <form class="form" id="loginForm">
                    <label class="labelUsername" for="inputUsername">Username<br></label>
                    <input id="inputUsername" type="text" name="username" autocomplete="username" required><br>
                    <label class="labelPassword" for="inputPassword">Password<br></label>
                    <input id="inputPassword" type="password" name="password" autocomplete="current-password" required><br>
                    <button class="button" type="submit">Log in</button>
                    <p id="loginMessage" role="status" aria-live="polite"></p>
                </form>
            </div>
        </div>
        <section id="lockerSection" hidden>
            <h2>Choose your locker</h2>
            <div id="lockerGrid"></div>
            <div id="lockerAction" hidden>
                <h3 id="selectedLockerTitle"></h3>
                <p>Bạn đã đóng cửa tủ chưa?</p>
                <button id="storedDoneButton" type="button">
                    COMPLETE
                </button>
                <button id="needRetrieveButton" type="button">
                    RE-OPEN
                </button>
            </div>
        </section>
        <script src="script.js"></script>
    </body>
</html>
