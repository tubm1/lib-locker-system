<!DOCTYPE html>
<html>
    <head>
        <meta charset = 'UTF-8'>
        <link rel="stylesheet" href="style.css">
        <title>LIB LOCKER SYSTEM</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>Library Locker Management System</h1>
        <div class="login-area">
            <div class="main">
                <h1>Login</h1>
                <form class="form" id="loginForm">
                    <label class="labelUsername" for="inputUsername">Username<br></label>
                    <input id="inputUsername" type="text" name="username" required><br>
                    <label class="labelPassword" for="inputPassword">Password<br></label>
                    <input id="inputPassword" type="password" name="password" required><br>
                    <button class="button" type="submit">Log in</button>
                    <p id="loginMessage"></p>
                </form>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
